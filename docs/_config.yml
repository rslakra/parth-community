# Parth community site: built by GitHub Pages (Settings → Pages → Deploy from a branch → main, /docs).
# Published at https://rslakra.github.io/parth-docs/

title: Parth
description: Install Parth, set it up, and get help. For VS Code, Cursor, Windsurf, VSCodium and JetBrains IDEs.

# Theme: just-the-docs, loaded by GitHub Pages as a remote theme (no Gemfile needed to publish).
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links

# Links between pages are written as ordinary relative .md links, so they also work when the files
# are read on github.com.
relative_links:
  enabled: true
  collections: false
permalink: pretty

url: https://rslakra.github.io
baseurl: /parth-docs

logo: /assets/images/parth-logo.png
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  "Report an issue": https://github.com/rslakra/parth-docs/issues/new/choose
  "VS Code Marketplace": https://marketplace.visualstudio.com/items?itemName=ameyllc.parth
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 Amey LLC. All rights reserved. <a href=\"https://rslakra.github.io/parth-docs/license/\">License</a>"

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red

# Maintainer files that live next to the site but aren't pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
